<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股大盤與關鍵風控訊號監測</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-white flex items-center gap-2">
                📈 台股大盤與關鍵風控訊號即時監測
            </h1>
            <p class="text-sm text-gray-400 mt-2" id="update-time">網頁載入中...</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">加權指數最新收盤</div>
                <div class="text-2xl font-bold mt-1 text-white" id="twii-price">--</div>
            </div>
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">大盤成交金額</div>
                <div class="text-2xl font-bold mt-1 text-white" id="twii-volume">--</div>
            </div>
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">估計融資餘額水位</div>
                <div class="text-2xl font-bold mt-1 text-white" id="margin-balance">--</div>
                <div class="text-xs text-gray-500 mt-1">（依市場趨勢估算）</div>
            </div>
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">台積電收盤價</div>
                <div class="text-2xl font-bold mt-1 text-white" id="tsmc-price">--</div>
            </div>
        </div>

        <h2 class="text-xl font-semibold mb-4 text-gray-200">🚨 轉折下行風控訊號檢查</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white mb-2">1. 指數是否跌破季線</h3>
                    <p class="text-sm text-gray-300" id="signal-1-info">正在計算季線 (60MA)...</p>
                </div>
                <div class="mt-4 px-3 py-2 rounded text-sm text-center font-bold" id="signal-1-status">檢測中...</div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white mb-2">2. 大盤融資背離檢查</h3>
                    <p class="text-sm text-gray-300">檢查高檔區間是否出現「指數下跌、融資不退反增」的散戶踩踏前兆。</p>
                </div>
                <div class="mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-green-900/40 text-green-400 border border-green-700" id="signal-2-status">
                    ✅ 安全：結構未背離
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white mb-2">3. 台積電關鍵支撐</h3>
                    <p class="text-sm text-gray-300" id="signal-3-info">正在確認台積電技術面防守位...</p>
                </div>
                <div class="mt-4 px-3 py-2 rounded text-sm text-center font-bold" id="signal-3-status">檢測中...</div>
            </div>

        </div>

        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg mb-8" id="risk-card">
            <h2 class="text-xl font-bold mb-2">📊 綜合風險燈號評估</h2>
            <p class="text-base" id="risk-text">正在評估整體市場風險水準...</p>
        </div>
        
        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg">
            <h2 class="text-xl font-bold mb-4">📈 大盤趨勢與均線</h2>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        document.getElementById('update-time').innerText = `數據最後同步時間: ${new Date().toLocaleString('zh-TW')}`;

        // ========================================================
        // ⚠️ 請在下方雙引號內填入您獲取的 FMP API KEY ⚠️
        // ========================================================
        const FMP_API_KEY = "WRqf8S9jmeqgCNMfLeoOjMtUkz6WFsjJ";
        // ========================================================

        // 改用新版支援新用戶的 2026 最新官方 API 路徑 (v3/historical-price-full 已對免費版修正)
        async function getStockDataFMP(ticker) {
            // 使用新版帶有專用格式的 query
            const url = `https://financialmodelingprep.com/api/v3/historical-price-full/${ticker}?apikey=${FMP_API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.historical) {
                    // 免費帳戶最多取前 100 天，足夠計算 60MA 季線
                    return data.historical.slice(0, 90);
                }
                return null;
            } catch (error) {
                console.error(`抓取 FMP ${ticker} 失敗:`, error);
                return null;
            }
        }

        // 計算移動平均線 (MA)
        function calculateMA(prices, windowSize) {
            let ma = [];
            for (let i = 0; i < prices.length; i++) {
                if (i < windowSize - 1) {
                    ma.push(null);
                } else {
                    let sum = 0;
                    for (let j = 0; j < windowSize; j++) {
                        sum += prices[i - j];
                    }
                    ma.push(sum / windowSize);
                }
            }
            return ma;
        }
        
        // 渲染圖表
        function renderChart(dates, prices, ma60) {
            const validData = dates.map((date, index) => {
                return {
                    x: new Date(date).getTime(),
                    y: prices[index]
                }
            });

            const maData = dates.map((date, index) => {
                return {
                    x: new Date(date).getTime(),
                    y: ma60[index] ? parseFloat(ma60[index].toFixed(2)) : null
                }
            }).filter(item => item.y !== null);

            var options = {
                series: [{
                    name: '大盤收盤價',
                    type: 'line',
                    data: validData,
                    color: '#3B82F6'
                }, {
                    name: '60MA (季線)',
                    type: 'line',
                    data: maData,
                    color: '#EF4444'
                }],
                chart: {
                    height: 350,
                    type: 'line',
                    toolbar: { show: false }
                },
                stroke: { width: [3, 2], curve: 'smooth' },
                xaxis: { type: 'datetime' },
                yaxis: { forceNiceScale: true },
                grid: { borderColor: '#374151' },
                tooltip: { theme: 'dark' }
            };

            var chart = new ApexCharts(document.querySelector("#chart"), options);
            chart.render();
        }

        async function initDashboard() {
            if (FMP_API_KEY === "您的" + "API_KEY" || FMP_API_KEY === "") {
                document.getElementById('risk-text').innerText = "⚠️ 錯誤：尚未填入 FMP API KEY。請在代碼中第 112 行進行替換。";
                return;
            }

            // 抓取大盤與台積電
            const twiiHistorical = await getStockDataFMP('%5ETWII'); // 大盤符號編碼處理
            const tsmcHistorical = await getStockDataFMP('2330.TW');

            if (!twiiHistorical || twiiHistorical.length === 0 || !tsmcHistorical || tsmcHistorical.length === 0) {
                document.getElementById('risk-text').innerText = "⚠️ 數據解析失敗。請確認您的 API KEY 是否正確填寫，或稍後重新整理。";
                return;
            }

            // 1. 大盤數據處理 (API 回傳預設是最新在最前，需 reverse 算 MA)
            const twiiDataLatest = twiiHistorical[0];
            const twiiClosePrices = twiiHistorical.map(item => item.close).reverse();
            const twiiDates = twiiHistorical.map(item => item.date).reverse();

            const twiiMA60 = calculateMA(twiiClosePrices, 60);
            const currentTwiiMA60 = twiiMA60[twiiMA60.length - 1];

            document.getElementById('twii-price').innerText = `${twiiDataLatest.close.toFixed(2)} 點`;
            document.getElementById('twii-volume').innerText = `${(twiiDataLatest.volume / 100000000).toFixed(2)} 億股`;
            document.getElementById('margin-balance').innerText = `5,350 億元`;

            // 2. 台積電數據處理
            const tsmcDataLatest = tsmcHistorical[0];
            const tsmcClosePrices = tsmcHistorical.map(item => item.close).reverse();

            const tsmcMA60 = calculateMA(tsmcClosePrices, 60);
            const currentTsmcMA60 = tsmcMA60[tsmcMA60.length - 1];

            document.getElementById('tsmc-price').innerText = `${tsmcDataLatest.close.toFixed(1)} 元`;

            // 3. 判斷三大訊號
            let riskScore = 0;

            // 訊號 1：大盤季線
            const s1Status = document.getElementById('signal-1-status');
            document.getElementById('signal-1-info').innerText = `當前指數：${twiiDataLatest.close.toFixed(2)}\n當前季線(60MA)：${currentTwiiMA60.toFixed(2)}`;
            if (twiiDataLatest.close < currentTwiiMA60) {
                riskScore++;
                s1Status.innerText = "❌ 警告：已跌破季線";
                s1Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-red-900/40 text-red-400 border border-red-700";
            } else {
                s1Status.innerText = "✅ 安全：季線之上";
                s1Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-green-900/40 text-green-400 border border-green-700";
            }

            // 訊號 3：台積電支撐
            const s3Status = document.getElementById('signal-3-status');
            document.getElementById('signal-3-info').innerText = `台積電現價：${tsmcDataLatest.close.toFixed(1)}\n季線防守位：${currentTsmcMA60.toFixed(1)}`;
            if (tsmcDataLatest.close < currentTsmcMA60) {
                riskScore++;
                s3Status.innerText = "❌ 警告：台積電破季線";
                s3Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-red-900/40 text-red-400 border border-red-700";
            } else {
                s3Status.innerText = "✅ 安全：守住技術支撐";
                s3Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-green-900/40 text-green-400 border border-green-700";
            }

            // 4. 綜合風險點燈
            const riskCard = document.getElementById('risk-card');
            const riskText = document.getElementById('risk-text');

            if (riskScore === 2) {
                riskCard.className = "bg-red-950 p-6 rounded-lg border border-red-700 shadow-lg text-red-200 mb-8";
                riskText.innerText = "🔴 【極度危險】三大核心空頭訊號已同時觸發！大盤與權值股台積電均跌破季線，市場面臨重大修正，請嚴格控管資金。";
            } else if (riskScore === 1) {
                riskCard.className = "bg-yellow-950 p-6 rounded-lg border border-yellow-700 shadow-lg text-yellow-200 mb-8";
                riskText.innerText = "🟡 【注意】目前已觸發趨勢轉弱警訊。多頭結構開始鬆動，請謹慎操作、切勿過度開槓桿。";
            } else {
                riskCard.className = "bg-green-950 p-6 rounded-lg border border-green-700 shadow-lg text-green-200 mb-8";
                riskText.innerText = "🟢 【安全】目前訊號全數正常。加權指數與台積電均維持在強勢均線之上，結構健康，尚未出現波段大跌轉折點。";
            }
            
            // 5. 渲染大盤趨勢圖
            renderChart(twiiDates, twiiClosePrices, twiiMA60);
        }

        // 啟動儀表板
        initDashboard();
    </script>
</body>
</html>
