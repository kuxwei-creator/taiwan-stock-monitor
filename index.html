<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股大盤風控決策儀表板 (半自動版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-white flex items-center gap-2">
                📊 台股大盤風控決策儀表板 <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded">半自動控制版</span>
            </h1>
            <p class="text-sm text-gray-400 mt-2">請手動填入當前市場數據，系統將自動進行多空與槓桿風險評估。</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-md md:col-span-1">
                <h2 class="text-xl font-semibold mb-4 text-blue-400 border-b border-gray-700 pb-2">✏️ 輸入今日數據</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">加權指數最新收盤</label>
                        <input type="number" id="input-twii" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" value="43636" placeholder="例如: 43636">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">大盤當前季線 (60MA)</label>
                        <input type="number" id="input-twii-ma" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" value="41500" placeholder="例如: 41500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">大盤今日融資變動趨勢</label>
                        <select id="input-margin" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                            <option value="normal">✅ 正常 (隨大盤漲跌或持續減少)</option>
                            <option value="divergent">❌ 危險背離 (指數大跌，但融資死不退反增)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">台積電最新股價</label>
                        <input type="number" id="input-tsmc" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" value="2295" placeholder="例如: 2295">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">台積電關鍵防守位 (季線)</label>
                        <input type="number" id="input-tsmc-ma" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" value="2120" placeholder="例如: 2120">
                    </div>
                    
                    <button onclick="calculateRisk()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition duration-200 mt-2 shadow-lg cursor-pointer">
                        🚀 開始風控指標評估
                    </button>
                </div>
            </div>

            <div class="md:col-span-2 space-y-6">
                
                <div class="p-6 rounded-lg border border-gray-700 shadow-lg transition-colors duration-300" id="risk-card">
                    <h2 class="text-2xl font-bold mb-2 flex items-center gap-2">
                        📊 綜合風險燈號評估：<span id="risk-title">未評估</span>
                    </h2>
                    <p class="text-base leading-relaxed" id="risk-text">請填寫左側數據並點擊評估按鈕。</p>
                </div>

                <h3 class="text-lg font-semibold text-gray-300">🚨 分項訊號檢查結果</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    
                    <div class="bg-gray-800 p-5 rounded-lg border border-gray-700">
                        <h4 class="font-bold text-sm text-gray-400 mb-2">1. 大盤生命線檢查</h4>
                        <div id="status-1" class="text-sm font-semibold p-2 rounded text-center bg-gray-700 text-gray-300">等待評估</div>
                    </div>

                    <div class="bg-gray-800 p-5 rounded-lg border border-gray-700">
                        <h4 class="font-bold text-sm text-gray-400 mb-2">2. 籌碼籌資背離</h4>
                        <div id="status-2" class="text-sm font-semibold p-2 rounded text-center bg-gray-700 text-gray-300">等待評估</div>
                    </div>

                    <div class="bg-gray-800 p-5 rounded-lg border border-gray-700">
                        <h4 class="font-bold text-sm text-gray-400 mb-2">3. 權值總司令防線</h4>
                        <div id="status-3" class="text-sm font-semibold p-2 rounded text-center bg-gray-700 text-gray-300">等待評估</div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script>
        function calculateRisk() {
            // 讀取手動輸入的數值
            const twii = parseFloat(document.getElementById('input-twii').value);
            const twiiMa = parseFloat(document.getElementById('input-twii-ma').value);
            const marginValue = document.getElementById('input-margin').value;
            const tsmc = parseFloat(document.getElementById('input-tsmc').value);
            const tsmcMa = parseFloat(document.getElementById('input-tsmc-ma').value);

            // 驗證欄位
            if (isNaN(twii) || isNaN(twiiMa) || isNaN(tsmc) || isNaN(tsmcMa)) {
                alert("請確認所有數值欄位皆已填寫正確！");
                return;
            }

            let riskScore = 0;

            // 1. 檢查大盤季線
            const status1 = document.getElementById('status-1');
            if (twii < twiiMa) {
                riskScore++;
                status1.innerText = "❌ 跌破季線 (空頭)";
                status1.className = "text-sm font-bold p-2 rounded text-center bg-red-900/40 text-red-400 border border-red-700";
            } else {
                status1.innerText = "✅ 季線之上 (多頭)";
                status1.className = "text-sm font-bold p-2 rounded text-center bg-green-900/40 text-green-400 border border-green-700";
            }

            // 2. 檢查融資背離
            const status2 = document.getElementById('status-2');
            if (marginValue === 'divergent') {
                riskScore++;
                status2.innerText = "❌ 出現散戶死不退背離";
                status2.className = "text-sm font-bold p-2 rounded text-center bg-red-900/40 text-red-400 border border-red-700";
            } else {
                status2.innerText = "✅ 籌碼結構正常";
                status2.className = "text-sm font-bold p-2 rounded text-center bg-green-900/40 text-green-400 border border-green-700";
            }

            // 3. 檢查台積電
            const status3 = document.getElementById('status-3');
            if (tsmc < tsmcMa) {
                riskScore++;
                status3.innerText = "❌ 台積電破防 (轉弱)";
                status3.className = "text-sm font-bold p-2 rounded text-center bg-red-900/40 text-red-400 border border-red-700";
            } else {
                status3.innerText = "✅ 台積電守住支撐";
                status3.className = "text-sm font-bold p-2 rounded text-center bg-green-900/40 text-green-400 border border-green-700";
            }

            // 4. 綜合風險點燈判定
            const riskCard = document.getElementById('risk-card');
            const riskTitle = document.getElementById('risk-title');
            const riskText = document.getElementById('risk-text');

            if (riskScore === 3) {
                riskCard.className = "p-6 rounded-lg border border-red-600 shadow-lg bg-red-950 text-red-100";
                riskTitle.innerText = "🔴 極度危險 (全面崩塌)";
                riskText.innerText = "🚨 警告：三大風控條件已完全滿足！大盤破線、融資死不退、台積電棄守。這是歷史級大修正（跌幅 20%+）的最核心前兆。強烈建議嚴格控管手頭資金、降低槓桿，甚至分批執行避險與減碼戰術！";
            } else if (riskScore === 2) {
                riskCard.className = "p-6 rounded-lg border border-orange-600 shadow-lg bg-orange-950 text-orange-100";
                riskTitle.innerText = "🟠 高度警覺 (結構鬆動)";
                riskText.innerText = "⚠️ 注意：目前市場已亮起 2 盞紅燈。多頭的生命防線正在被蠶食。此時不該再盲目追高，請仔細清點手上持股的持倉成本，並做好隨時抽離或分批停利減碼的防守準備。";
            } else if (riskScore === 1) {
                riskCard.className = "p-6 rounded-lg border border-yellow-600 shadow-lg bg-yellow-950 text-yellow-100";
                riskTitle.innerText = "🟡 局部警戒 (多空震盪)";
                riskText.innerText = "🔎 提示：目前觸發 1 個空頭警訊，可能屬於高檔的多頭洗盤或技術面修正。此時市場仍有基本面支撐，但操作中小型股時需提高警覺，切勿使用過高融資。";
            } else {
                riskCard.className = "p-6 rounded-lg border border-green-600 shadow-lg bg-green-950 text-green-100";
                riskTitle.innerText = "🟢 安全無虞 (多頭續航)";
                riskText.innerText = "✨ 太棒了！當前數據顯示市場完全符合健康的牛市常態。大盤與台積電皆在生命線上方強勢運行，籌碼面也未有踩踏危機。市場主旋律依舊是多頭掌控，繼續順勢而為即可。";
            }
        }
        
        // 網頁載入時先執行一次初始預設值的評估
        calculateRisk();
    </script>
</body>
</html>
