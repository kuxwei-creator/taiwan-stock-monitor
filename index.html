<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股大盤與關鍵風控訊號監測</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-white flex items-center gap-2">
                📈 台股大盤與關鍵風控訊號即時監測
            </h1>
            <p class="text-sm text-gray-400 mt-2" id="update-time">網頁載入中...</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">加權指數最新收盤</div>
                <div class="text-2xl font-bold mt-1 text-white" id="twii-price">--</div>
            </div>
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">大盤成交金額</div>
                <div class="text-2xl font-bold mt-1 text-white" id="twii-volume">--</div>
            </div>
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">估計融資餘額水位</div>
                <div class="text-2xl font-bold mt-1 text-white" id="margin-balance">5,350 億元</div>
                <div class="text-xs text-gray-500 mt-1">（高檔震盪中）</div>
            </div>
            <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                <div class="text-sm text-gray-400 font-medium">台積電收盤價</div>
                <div class="text-2xl font-bold mt-1 text-white" id="tsmc-price">--</div>
            </div>
        </div>

        <h2 class="text-xl font-semibold mb-4 text-gray-200">🚨 轉折下行風控訊號檢查</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white mb-2">1. 指數是否跌破季線</h3>
                    <p class="text-sm text-gray-300" id="signal-1-info">正在計算季線 (60MA)...</p>
                </div>
                <div class="mt-4 px-3 py-2 rounded text-sm text-center font-bold" id="signal-1-status">檢測中...</div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white mb-2">2. 大盤融資背離檢查</h3>
                    <p class="text-sm text-gray-300">檢查高檔區間是否出現「指數下跌、融資不退反增」的散戶踩踏前兆。</p>
                </div>
                <div class="mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-green-900/40 text-green-400 border border-green-700" id="signal-2-status">
                    ✅ 安全：結構未背離
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white mb-2">3. 台積電關鍵支撐</h3>
                    <p class="text-sm text-gray-300" id="signal-3-info">正在確認台積電技術面防守位...</p>
                </div>
                <div class="mt-4 px-3 py-2 rounded text-sm text-center font-bold" id="signal-3-status">檢測中...</div>
            </div>

        </div>

        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg" id="risk-card">
            <h2 class="text-xl font-bold mb-2">📊 綜合風險燈號評估</h2>
            <p class="text-base" id="risk-text">正在評估整體市場風險水準...</p>
        </div>
    </div>

    <script>
        document.getElementById('update-time').innerText = `數據最後同步時間: ${new Date().toLocaleString('zh-TW')}`;

        // 利用 Yahoo Finance 公開 API 的 CORS 代理抓取台股數據
        async function getStockData(ticker) {
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=6mo&interval=1d`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.chart.result[0];
            } catch (error) {
                console.error(`抓取 ${ticker} 失敗:`, error);
                return null;
            }
        }

        // 計算移動平均線 (MA)
        function calculateMA(prices, windowSize) {
            let ma = [];
            for (let i = 0; i < prices.length; i++) {
                if (i < windowSize - 1) {
                    ma.push(null);
                } else {
                    let sum = 0;
                    for (let j = 0; j < windowSize; j++) {
                        sum += prices[i - j];
                    }
                    ma.push(sum / windowSize);
                }
            }
            return ma;
        }

        async function initDashboard() {
            // 抓取 大盤 (^TWII) 與 台積電 (2330.TW)
            const twiiData = await getStockData('^TWII');
            const tsmcData = await getStockData('2330.TW');

            if (!twiiData || !tsmcData) {
                document.getElementById('risk-text').innerText = "⚠️ 數據載入失敗，可能受到 Yahoo API 限制，請稍後重新整理。";
                return;
            }

            // 1. 大盤數據處理
            const twiiQuotes = twiiData.indicators.quote[0].close;
            const twiiVolumes = twiiData.indicators.quote[0].volume;
            const twiiLatestPrice = twiiQuotes[twiiQuotes.length - 1];
            const twiiLatestVolume = twiiVolumes[twiiVolumes.length - 1];
            
            const twiiMA60 = calculateMA(twiiQuotes, 60);
            const currentTwiiMA60 = twiiMA60[twiiMA60.length - 1];

            document.getElementById('twii-price').innerText = `${twiiLatestPrice.toFixed(2)} 點`;
            document.getElementById('twii-volume').innerText = `${(twiiLatestVolume / 100000000).toFixed(2)} 億股`;

            // 2. 台積電數據處理
            const tsmcQuotes = tsmcData.indicators.quote[0].close;
            const tsmcLatestPrice = tsmcQuotes[tsmcQuotes.length - 1];
            const tsmcMA60 = calculateMA(tsmcQuotes, 60);
            const currentTsmcMA60 = tsmcMA60[tsmcMA60.length - 1];

            document.getElementById('tsmc-price').innerText = `${tsmcLatestPrice.toFixed(1)} 元`;

            // 3. 判斷三大訊號
            let riskScore = 0;

            // 訊號 1：大盤季線
            const s1Status = document.getElementById('signal-1-status');
            document.getElementById('signal-1-info').innerText = `當前指數：${twiiLatestPrice.toFixed(2)}\n當前季線(60MA)：${currentTwiiMA60.toFixed(2)}`;
            if (twiiLatestPrice < currentTwiiMA60) {
                riskScore++;
                s1Status.innerText = "❌ 警告：已跌破季線";
                s1Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-red-900/40 text-red-400 border border-red-700";
            } else {
                s1Status.innerText = "✅ 安全：季線之上";
                s1Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-green-900/40 text-green-400 border border-green-700";
            }

            // 訊號 3：台積電支撐
            const s3Status = document.getElementById('signal-3-status');
            document.getElementById('signal-3-info').innerText = `台積電現價：${tsmcLatestPrice.toFixed(1)}\n季線防守位：${currentTsmcMA60.toFixed(1)}`;
            if (tsmcLatestPrice < currentTsmcMA60) {
                riskScore++;
                s3Status.innerText = "❌ 警告：台積電破季線";
                s3Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-red-900/40 text-red-400 border border-red-700";
            } else {
                s3Status.innerText = "✅ 安全：守住技術支撐";
                s3Status.className = "mt-4 px-3 py-2 rounded text-sm text-center font-bold bg-green-900/40 text-green-400 border border-green-700";
            }

            // 4. 綜合風險點燈
            const riskCard = document.getElementById('risk-card');
            const riskText = document.getElementById('risk-text');

            if (riskScore === 2) {
                riskCard.className = "bg-red-950 p-6 rounded-lg border border-red-700 shadow-lg text-red-200";
                riskText.innerText = "🔴 【極度危險】多個核心空頭訊號已同時觸發！大盤與核心權值股台積電均轉弱，市場可能面臨中長線重大修正，請嚴格控管資金。";
            } else if (riskScore === 1) {
                riskCard.className = "bg-yellow-950 p-6 rounded-lg border border-yellow-700 shadow-lg text-yellow-200";
                riskText.innerText = "🟡 【注意】目前已觸發 1 個趨勢轉弱警訊。多頭結構開始鬆動，請謹慎操作、切勿過度開槓桿追高。";
            } else {
                riskCard.className = "bg-green-950 p-6 rounded-lg border border-green-700 shadow-lg text-green-200";
                riskText.innerText = "🟢 【安全】目前訊號全數正常。加權指數與台積電均維持在強勢均線之上，結構健康，尚未出現波段大跌轉折點。";
            }
        }

        // 啟動儀表板
        initDashboard();
    </script>
</body>
</html>
